# Ruff configuration for code linting and formatting

line-length = 100
target-version = "py311"

# Exclude non-Python directories and files
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
    ".astro",
    ".next",
    ".cache",
    "services/frontend",
    "services/web-check",
    "backup_ai_drafts",
    "src/flask_original",
    "app_with_logging.py",  # Not a Python file, just notes
    "*.min.js",
    "*.min.css",
]

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B006",   # Do not use mutable data structures for argument defaults
    "B904",   # raise-without-from-inside-except (not critical for HTTPException)
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "RUF001", # String contains ambiguous unicode characters (allow Cyrillic in strings)
    "RUF002", # Docstring contains ambiguous unicode characters (allow Cyrillic in docstrings)
    "RUF003", # Comment contains ambiguous unicode characters (allow Cyrillic in comments)
    # Style suggestions (not critical, can fix later)
    "PTH100", # os.path.abspath -> Path.resolve
    "PTH103", # os.makedirs -> Path.mkdir
    "PTH118", # os.path.join -> Path /
    "PTH120", # os.path.dirname -> Path.parent
    "PTH123", # open() -> Path.open()
    "SIM102", # collapsible-if (readability preference)
    "SIM103", # needless-bool
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "TCH002", # typing-only-third-party-import (not critical)
    "F841",   # unused-variable (will fix later)
    "B007",   # unused-loop-control-variable (minor)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**" = ["ARG", "S101"]  # Allow test-specific patterns
"scripts/**" = ["E402", "PTH"]  # Scripts may have path manipulation
"alembic/**" = ["E402", "PTH"]  # Alembic migrations have specific structure

[lint.isort]
known-first-party = ["src"]

[lint.mccabe]
max-complexity = 10
