# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^backup_ai_drafts/|^app_with_logging\.py$
      - id: ruff-format
        exclude: ^backup_ai_drafts/|^app_with_logging\.py$

  # Python type checking (опционально, можно отключить если проблемы)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports, --no-strict-optional]
  #       files: ^src/

  # Security checks (using local bandit if available, skip if network issues)
  - repo: local
    hooks:
      - id: bandit-local
        name: Bandit security scan
        entry: bash
        args:
          - -c
          - |
            if command -v bandit &> /dev/null; then
              bandit -ll -r src/ --exclude backup_ai_drafts/ || exit 1
            else
              echo "⚠️ Bandit not found. Install with: pip install bandit"
              echo "   Skipping bandit check..."
              exit 0
            fi
        language: system
        files: ^src/.*\.py$
        exclude: backup_ai_drafts/|app_with_logging\.py
        pass_filenames: false
        always_run: false

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package\.lock\.json|backup_ai_drafts/|node_modules/|dist/|build/|app_with_logging\.py

  # Frontend checks (prettier - опционально, можно отключить если проблемы)
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v3.1.0
  #   hooks:
  #     - id: prettier
  #       files: \.(json|yaml|yml|md)$
  #       exclude: ^(node_modules|\.astro|dist|build)/

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

  # Dockerfile linting (опционально, можно отключить если проблемы)
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.12.0
  #   hooks:
  #     - id: hadolint-docker
  #       args: [--ignore, DL3008, --ignore, DL3009]

  # Custom hooks
  - repo: local
    hooks:
      - id: check-secrets
        name: Check for hardcoded secrets
        entry: bash
        args:
          - -c
          - |
            if grep -rE "(api[_-]?key|secret|password|token|credential)\s*[:=]\s*['\"][^'\"]{10,}" \
              --include="*.py" --include="*.ts" --include="*.js" \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build \
              --exclude-dir=.astro --exclude-dir=.next --exclude-dir=.cache \
              --exclude=app_with_logging.py --exclude=backup_ai_drafts \
              src/ services/ 2>/dev/null | \
              grep -v "SEC_SCANNER\|process\.env\|import\.meta\.env\|node_modules"; then
              echo "⚠️ Potential secrets found!"
              exit 1
            fi
        language: system
        pass_filenames: false
        always_run: true

      - id: check-migration-naming
        name: Check Alembic migration naming
        entry: bash
        args:
          - -c
          - |
            for file in alembic/versions/*.py; do
              if [[ ! "$file" =~ ^alembic/versions/[0-9]{8}_[0-9]{4}_[a-z0-9_]+\.py$ ]]; then
                echo "❌ Invalid migration filename: $file (should be YYYYMMDD_HHMM_description.py)"
                exit 1
              fi
            done
        language: system
        files: ^alembic/versions/.*\.py$

      - id: check-imports
        name: Check Python imports
        entry: python -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]'
        language: system
        files: \.py$
        exclude: ^backup_ai_drafts/|^app_with_logging\.py$

      - id: check-frontend-build
        name: Check frontend can build
        entry: bash
        args:
          - -c
          - |
            cd services/frontend && \
            npm ci --silent && \
            npm run build --if-present || \
            echo "⚠️ Frontend build check skipped (no build script)"
        language: system
        files: ^services/frontend/
        pass_filenames: false
        always_run: false
