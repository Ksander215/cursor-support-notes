# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --no-strict-optional]
        files: ^src/

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-ll, -r]
        files: ^src/

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package.lock.json

  # Frontend checks
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(json|yaml|yml|md)$
        exclude: ^(node_modules|\.astro|dist|build)/

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # Custom hooks
  - repo: local
    hooks:
      - id: check-secrets
        name: Check for hardcoded secrets
        entry: bash -c 'if grep -rE "(api[_-]?key|secret|password|token|credential)\s*[:=]\s*['\''\"][^'\''\"]{10,}" --include="*.py" --include="*.ts" --include="*.js" src/ services/ 2>/dev/null | grep -v "SEC_SCANNER\|process\.env\|import\.meta\.env"; then echo "⚠️ Potential secrets found!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: check-migration-naming
        name: Check Alembic migration naming
        entry: bash -c 'for file in alembic/versions/*.py; do if [[ ! "$file" =~ ^alembic/versions/[0-9]{8}_[0-9]{4}_[a-z0-9_]+\.py$ ]]; then echo "❌ Invalid migration filename: $file (should be YYYYMMDD_HHMM_description.py)"; exit 1; fi; done'
        language: system
        files: ^alembic/versions/.*\.py$

      - id: check-imports
        name: Check Python imports
        entry: python -c "import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]"
        language: system
        files: \.py$

      - id: check-frontend-build
        name: Check frontend can build
        entry: bash -c 'cd services/frontend && npm ci --silent && npm run build --if-present || echo "⚠️ Frontend build check skipped (no build script)"'
        language: system
        files: ^services/frontend/
        pass_filenames: false
        always_run: false
