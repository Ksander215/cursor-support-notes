name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scan
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run Safety check
        continue-on-error: true
        run: |
          echo "## 🔒 Python Dependency Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --json || true
            safety check --file requirements.txt || true
          else
            echo "⚠️ No requirements.txt found" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run pip-audit
        continue-on-error: true
        run: |
          echo "## 📦 pip-audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f requirements.txt ]; then
            pip-audit --requirement requirements.txt --format=json --output pip-audit-results.json || true
            pip-audit --requirement requirements.txt || true
          fi
      
      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            pip-audit-results.json
          retention-days: 30

  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          echo "## 🛡️ Bandit Security Scan" >> $GITHUB_STEP_SUMMARY
          bandit -r src/ -f json -o bandit-results.json -ll || true
          bandit -r src/ -ll || true
      
      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          no-git: false
          verbose: true
      
      - name: Check for hardcoded secrets
        continue-on-error: true
        run: |
          echo "## 🔐 Secret Detection Results" >> $GITHUB_STEP_SUMMARY
          
          # Check for common secret patterns
          SECRETS_FOUND=0
          
          # API keys
          if grep -rE "(api[_-]?key|apikey)\s*[:=]\s*['\"][^'\"]{20,}" --include="*.py" --include="*.ts" --include="*.js" --include="*.astro" src/ services/ 2>/dev/null | grep -v "SEC_SCANNER\|process\.env\|import\.meta\.env\|X-API-Key"; then
            echo "⚠️ Potential API keys found" >> $GITHUB_STEP_SUMMARY
            SECRETS_FOUND=1
          fi
          
          # Passwords
          if grep -rE "(password|pwd|passwd)\s*[:=]\s*['\"][^'\"]{8,}" --include="*.py" --include="*.ts" --include="*.js" src/ services/ 2>/dev/null | grep -v "SEC_SCANNER\|process\.env\|import\.meta\.env"; then
            echo "⚠️ Potential passwords found" >> $GITHUB_STEP_SUMMARY
            SECRETS_FOUND=1
          fi
          
          # Tokens
          if grep -rE "(token|bearer|auth[_-]?token)\s*[:=]\s*['\"][^'\"]{20,}" --include="*.py" --include="*.ts" --include="*.js" src/ services/ 2>/dev/null | grep -v "SEC_SCANNER\|process\.env\|import\.meta\.env"; then
            echo "⚠️ Potential tokens found" >> $GITHUB_STEP_SUMMARY
            SECRETS_FOUND=1
          fi
          
          # AWS keys
          if grep -rE "(aws[_-]?access[_-]?key|aws[_-]?secret[_-]?key)\s*[:=]\s*['\"][^'\"]{10,}" --include="*.py" --include="*.ts" --include="*.js" src/ services/ 2>/dev/null; then
            echo "⚠️ Potential AWS keys found" >> $GITHUB_STEP_SUMMARY
            SECRETS_FOUND=1
          fi
          
          if [ $SECRETS_FOUND -eq 0 ]; then
            echo "✅ No obvious secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Please review and remove any hardcoded secrets" >> $GITHUB_STEP_SUMMARY
          fi

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.changed_files, 'Dockerfile')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities, just report
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Scan Dockerfile
        if: exists('Dockerfile')
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'

  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript
          queries: security-extended
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: security

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security, secret-scan]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-results
      
      - name: Generate Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scans Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency vulnerability scan" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code security analysis (Bandit)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container security scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SAST analysis (CodeQL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check individual job results for detailed findings." >> $GITHUB_STEP_SUMMARY
          echo "🔍 Review security alerts in the Security tab." >> $GITHUB_STEP_SUMMARY
